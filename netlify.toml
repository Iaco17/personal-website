[build]
  command = "npm run build"
  publish = "dist"

# Vite fingerprints files in /assets, so they can be cached forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# "Save my contact": phones open the contact card instead of showing raw text
[[headers]]
  for = "/iacopo-prai.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
    Content-Disposition = "attachment; filename=Iacopo-Prai.vcf"
